name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.24.1)'
        required: true

permissions:
  contents: write     # needed to create releases and upload assets

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # `av` (PyAV, app/media_viewer.py's video-thumbnail decoder since
      # 2026-09-14) MUST be built from source here, linked against a real
      # FFmpeg with a working HEVC decoder -- the plain prebuilt PyPI wheel
      # was confirmed (directly, against real HEVC iPhone video) to yield
      # zero decoded frames for HEVC content, Apple's default recording
      # codec since iOS 11. This whole step was UNVERIFIED end-to-end on a
      # real Windows build as of the commit that first added it, and the
      # first real run confirmed why: the hardcoded assumption about where
      # `choco install ffmpeg-shared` extracts its files
      # (`...\tools\ffmpeg-*-shared\lib\pkgconfig`) was wrong --
      # `Get-ChildItem` found nothing there at all. Rewritten below to
      # search for the real `.pc` file wherever the package actually put
      # it, and to print the full extracted tree first so a future
      # failure here comes with real diagnostic data instead of another
      # blind guess. If ffmpeg-shared itself turns out not to ship
      # pkg-config files at all, check pyav-org/PyAV's own Windows build
      # docs for its `--ffmpeg-dir`/`FFMPEG_ROOT` alternative to
      # pkg-config discovery -- see TODO.md item 17 for the full
      # investigation this was built from.
      - name: Install FFmpeg dev files (for building PyAV from source)
        run: |
          choco install ffmpeg-shared -y
          if ($LASTEXITCODE -ne 0) {
            Write-Host "choco install ffmpeg-shared failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          choco install pkgconfiglite -y
          if ($LASTEXITCODE -ne 0) {
            Write-Host "choco install pkgconfiglite failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "=== ffmpeg-shared install tree ==="
          Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg-shared" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 200 FullName

      - name: Install dependencies
        env:
          PKG_CONFIG: pkgconf
        run: |
          $pcFile = Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg-shared" -Recurse -Filter "libavcodec.pc" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pcFile) {
            Write-Host "No libavcodec.pc found under the ffmpeg-shared install -- see the previous step's printed tree to find where its files actually landed."
            exit 1
          }
          $pkgConfigDir = $pcFile.DirectoryName
          Write-Host "Found pkg-config files at: $pkgConfigDir"
          echo "PKG_CONFIG_PATH=$pkgConfigDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          python -m pip install --upgrade pip
          pip install --no-binary av -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller ffs_explorer.spec

      - name: Zip the dist folder
        run: |
          Compress-Archive -Path dist\ffs-explorer\* -DestinationPath ffs-explorer-windows.zip

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: ffs-explorer-windows.zip
          generate_release_notes: true   # auto-generates changelog from commits
