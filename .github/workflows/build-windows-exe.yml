name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.24.1)'
        required: true

permissions:
  contents: write     # needed to create releases and upload assets

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # `av` (PyAV, app/media_viewer.py's video-thumbnail decoder since
      # 2026-09-14): the plain prebuilt PyPI wheel was confirmed on macOS
      # to yield zero decoded frames for real HEVC content (Apple's
      # default recording codec since iOS 11). A from-source build linked
      # against a real FFmpeg fixed it there -- but getting an equivalent
      # Windows FFmpeg dev environment through chocolatey burned two real
      # CI failures (a stale package checksum, then no pkg-config files at
      # all in the standard Windows FFmpeg distribution), and reliably
      # passing PyAV's own `--ffmpeg-dir=` setup.py flag through a modern
      # `pip install`'s build isolation turned out to be genuinely
      # uncertain territory neither this session nor a web search could
      # nail down without just trying it. Per direct instruction, testing
      # the cheaper hypothesis FIRST instead of continuing to engineer
      # that blind: the macOS finding was only ever checked against the
      # macOS wheel -- the Windows wheel is a separately-built artifact
      # and may simply have HEVC support the macOS one doesn't (Windows
      # FFmpeg builds are commonly compiled with a more complete codec
      # set than Apple's own bundling choices). Back to a plain
      # `pip install -r requirements.txt` for this run -- if the real
      # Windows build plays a real HEVC thumbnail correctly, the whole
      # from-source detour was unnecessary; if not, we've ruled it out
      # cheaply before returning to engineer that path for real. See
      # TODO.md item 17 for the full investigation.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller ffs_explorer.spec

      - name: Zip the dist folder
        run: |
          Compress-Archive -Path dist\ffs-explorer\* -DestinationPath ffs-explorer-windows.zip

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: ffs-explorer-windows.zip
          generate_release_notes: true   # auto-generates changelog from commits
